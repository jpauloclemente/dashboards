<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Qual é o seu final de semana? - Seu Trem</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700;900&display=swap');

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: #FFFFFF;
  }

  body {
    font-family: 'Roboto', Arial, sans-serif;
    color: #202124;
    display: flex;
    justify-content: center;
    padding: 6vw 4vw 8vw;
  }

  .page {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .brand {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #34A853;
    margin-bottom: 2mm;
  }

  h1 {
    font-size: 21px;
    font-weight: 700;
    text-align: center;
    line-height: 1.3;
    margin: 0 0 6vw;
    letter-spacing: -0.3px;
  }

  h1 .accent { color: #4285F4; }

  /* ---------- WHEEL ---------- */
  .wheel-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    max-width: 420px;
    margin-bottom: 7vw;
  }

  .wheel-wrap svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .wheel-wrap svg line {
    stroke: #DADCE0;
    stroke-width: 1.4;
    stroke-dasharray: 4 4;
  }

  .node {
    position: absolute;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5mm;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    font-family: inherit;
  }

  .node .bubble {
    width: 15vw;
    height: 15vw;
    max-width: 62px;
    max-height: 62px;
    min-width: 46px;
    min-height: 46px;
    border-radius: 50%;
    background: #FFFFFF;
    border: 1.5px solid #E8EAED;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 6.5vw;
    max-font-size: 26px;
    box-shadow: 0 2px 6px rgba(60,64,67,0.12);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }

  .node .bubble { font-size: clamp(20px, 6.2vw, 26px); }

  .node:active .bubble,
  .node.tapped .bubble {
    transform: scale(0.92);
    box-shadow: 0 1px 3px rgba(60,64,67,0.18);
  }

  .node:hover .bubble {
    transform: scale(1.08);
    border-color: #4285F4;
    box-shadow: 0 4px 10px rgba(66,133,244,0.25);
  }

  .node .label {
    font-size: 10.5px;
    font-weight: 700;
    text-align: center;
    color: #202124;
    line-height: 1.2;
    white-space: nowrap;
  }

  .node .sublabel {
    font-size: 8.5px;
    font-weight: 400;
    color: #5F6368;
    text-align: center;
    line-height: 1.2;
    max-width: 22vw;
  }

  .node.center .bubble {
    width: 20vw;
    height: 20vw;
    max-width: 84px;
    max-height: 84px;
    min-width: 62px;
    min-height: 62px;
    font-size: clamp(28px, 8.5vw, 34px);
    background: #E8F0FE;
    border: 2px solid #4285F4;
    box-shadow: 0 3px 10px rgba(66,133,244,0.25);
  }

  .node.center .label {
    color: #4285F4;
    font-size: 10px;
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }

  /* positions (% of wheel-wrap) */
  .pos-center { left: 50%; top: 50%; }
  .pos-date   { left: 50%; top: 12%; }
  .pos-amigos { left: 86%; top: 38%; }
  .pos-familia{ left: 72%; top: 82%; }
  .pos-vegan  { left: 28%; top: 82%; }
  .pos-sozinho{ left: 14%; top: 38%; }

  /* ---------- MODAL / CAIXINHA ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(32,33,36,0.45);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 6vw;
    z-index: 50;
  }

  .overlay.open { display: flex; }

  .msg-box {
    background: #FFFFFF;
    border-radius: 16px;
    max-width: 380px;
    width: 100%;
    padding: 7vw 6vw 6vw;
    position: relative;
    box-shadow: 0 8px 28px rgba(32,33,36,0.28);
    text-align: center;
    animation: pop 0.18s ease;
  }

  @keyframes pop {
    from { transform: scale(0.9); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .msg-box .close-btn {
    position: absolute;
    top: 3vw;
    right: 3vw;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: none;
    background: #F1F3F4;
    color: #5F6368;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    line-height: 1;
  }

  .msg-box .emoji {
    font-size: 34px;
    margin-bottom: 3vw;
  }

  .msg-box .title {
    font-size: 15px;
    font-weight: 700;
    color: #202124;
    margin-bottom: 2.5vw;
  }

  .msg-box .text {
    font-size: 13.5px;
    line-height: 1.55;
    color: #3C4043;
  }

  .msg-box .text strong { color: #202124; }

  .msg-box.thanks .text {
    font-weight: 500;
    color: #202124;
  }

  /* ---------- FOOTER ---------- */
  footer {
    width: 100%;
    margin-top: 2vw;
  }

  .invite-callout {
    display: flex;
    align-items: center;
    gap: 4vw;
    background: #E6F4EA;
    border: 1.5px solid #34A853;
    border-radius: 12px;
    padding: 4vw 5vw;
  }

  .invite-callout .emoji { font-size: 26px; flex-shrink: 0; }

  .invite-callout .text {
    font-size: 12.5px;
    line-height: 1.5;
    color: #202124;
  }

  .invite-callout .text strong {
    color: #1E8E3E;
    font-weight: 700;
  }

  .signoff {
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    color: #34A853;
    margin-top: 5vw;
  }
</style>
</head>
<body>
<div class="page">

  <div class="brand">Seu Trem · 100% vegano e com opções sem glúten</div>
  <h1>Clique no cenário que melhor combina<br>com o <span class="accent">seu final de semana:</span></h1>

  <div class="wheel-wrap" id="wheel">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none">
      <line x1="50" y1="50" x2="50" y2="12"></line>
      <line x1="50" y1="50" x2="86" y2="38"></line>
      <line x1="50" y1="50" x2="72" y2="82"></line>
      <line x1="50" y1="50" x2="28" y2="82"></line>
      <line x1="50" y1="50" x2="14" y2="38"></line>
    </svg>

    <button class="node center pos-center" id="btn-center" aria-label="Obrigado">
      <span class="bubble">🙋</span>
    </button>

    <button class="node pos-date"
      data-emoji="💕" data-title="Date"
      data-text="Para o seu date temos drink de 1 litro na promoção e todos os aperitivos em desconto + alfajor ou brownie especial por apenas R$13.">
      <span class="bubble">💕</span>
      <span class="label">Date</span>
    </button>

    <button class="node pos-amigos"
      data-emoji="🤹‍♂️" data-title="Grupo de amigos"
      data-text="Drink de 1 litro na promoção e Iscas empanadas de shimeji com fritas de R$55,90 por R$22,36 na compra de 3 hambúrgueres, e R$33,54 na compra de 2 hambúrgueres.">
      <span class="bubble">🤹‍♂️</span>
      <span class="label">Grupo de<br>amigos</span>
    </button>

    <button class="node pos-familia"
      data-emoji="👨‍👨‍👦‍👦" data-title="Família"
      data-text="Pedindo 3 hambúrgueres, o nosso principal aperitivo (iscas empanadas de shimeji com fritas) sai de R$55,90 por R$22,36.">
      <span class="bubble">👨‍👨‍👦‍👦</span>
      <span class="label">Família</span>
    </button>

    <button class="node pos-vegan"
      data-emoji="🍀" data-title="Veganizar"
      data-text="Desconto em todos os aperitivos e queijo em dobro para todos se tiver um amigo carnista junto + drinks de 1 litro em promoção.">
      <span class="bubble">🍀</span>
      <span class="label">Veganizar</span>
      <span class="sublabel">sair com pessoa(s) carnista</span>
    </button>

    <button class="node pos-sozinho"
      data-emoji="😌" data-title="Passeando sozinho"
      data-text="Na compra de 1 hambúrguer leve qualquer aperitivo com 30% de desconto ou leve brownie + fritas + bebida de 500ml por apenas R$26. Como membro da comunidade, pode solicitar queijo em dobro!">
      <span class="bubble">😌</span>
      <span class="label">Passeando<br>sozinho</span>
    </button>
  </div>

  <footer>
    <div class="invite-callout">
      <div class="emoji">🎁</div>
      <div class="text">
        <strong>Chame um amigo para a comunidade!</strong><br>
        Vocês ganham 1 aperitivo vindo juntos na primeira visita (voucher válido para a próxima semana).
      </div>
    </div>
    <div class="signoff">Um Trem feito procê!</div>
  </footer>

</div>

<div class="overlay" id="overlay">
  <div class="msg-box" id="msgBox">
    <button class="close-btn" id="closeBtn" aria-label="Fechar">✕</button>
    <div class="emoji" id="msgEmoji"></div>
    <div class="title" id="msgTitle"></div>
    <div class="text" id="msgText"></div>
  </div>
</div>

<script>
  const overlay = document.getElementById('overlay');
  const msgBox = document.getElementById('msgBox');
  const msgEmoji = document.getElementById('msgEmoji');
  const msgTitle = document.getElementById('msgTitle');
  const msgText = document.getElementById('msgText');

  function openMessage(emoji, title, text, isThanks) {
    msgEmoji.textContent = emoji;
    msgTitle.textContent = title;
    msgText.innerHTML = text;
    msgBox.classList.toggle('thanks', !!isThanks);
    overlay.classList.add('open');
  }

  function closeMessage() {
    overlay.classList.remove('open');
  }

  document.getElementById('btn-center').addEventListener('click', () => {
    openMessage('🙋', 'Comunidade Seu Trem', 'Obrigado por fazer parte da comunidade, é muito importante para o nosso crescimento.', true);
  });

  document.querySelectorAll('.node[data-emoji]').forEach(node => {
    node.addEventListener('click', () => {
      openMessage(node.dataset.emoji, node.dataset.title, node.dataset.text, false);
    });
  });

  document.getElementById('closeBtn').addEventListener('click', closeMessage);
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeMessage();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeMessage();
  });
</script>

</body>
</html>
